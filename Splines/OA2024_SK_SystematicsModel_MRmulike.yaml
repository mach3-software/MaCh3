---
# Config for loading in the OA2021-23 systematics model
# this is an example
# Firstly, let's set up our non-systematics variables
settings:
  # File containing Kinematics
  mtuplefile: "t2ksk19b.fqv4r0b.21bv2_run11.hk_201x.fhc.numu_x_nue_numucc1piselec.root"
  # Tree storing kinematics
  mtupletree: "mtuple"

  # File containing Weights
  weightfile: "t2ksk23c.fqv4r0.21bv2_run11.fhc.numu_x_nue_numucc1piselec_weights.root"
  # Spline file
  outputfile: "dupa.root"

  modes: "MaCh3Modes_Beam.yaml"

binning_opts:
  # What binning variables do we use?
  binvar1: "erec"
  binvar2: "none"

  # Currently all binning for Etrue is located in a template ROOT file
  true_e_bins_template: "../blarb/flux_covariance_13av1_prelim.root"

  # What unit
  erec_mev: true

  # Erec Binning
  #OA2024 new binning for MRmu sample
  var1_bins: [ 0.0, 100.0, 200.0, 300.0, 400.0, 500.0, 600.0, 700.0, 800.0, 900.0,
               1000.0, 1100.0, 1200.0, 1300.0, 1400.0, 1500.0, 1600.0, 1800.0, 2000.0,
               2200.0, 2400.0, 2600.0, 2800.0, 3000.0, 3250.0, 3500.0, 3750.0, 4000.0,
               4500.0, 5000.0, 5500.0, 6000.0, 7000.0, 8000.0, 9000.0, 10000.0, 30000.0 ]

  # For mulike samples we have a single dummy bin
  var2_bins: [1e-15, 1e15]

systematics:
  MaCCQE:
    nominal_knot: 3
    interaction_modes: ["ccqe"]
    output_name: "MaCCQEGraph"

  SF_P1_2Shell_MeanF_Norm_O:
    nominal_knot: 3
    interaction_modes: ["ccqe"]
    output_name: "SF_P1_2Shell_MeanF_Norm_OGraph"



