# This scans MaCh3 and tries to find vulnerabilities
# KS: Scan both CPU and GPU
name: "CodeQL C++ Analysis"
on:
  schedule:
    - cron: '0 0 * * 1' # KS: Every Monday at midnight to not disturb during weekend...

jobs:
  analyze:
    name: Analyze C++ Code with CodeQL
    runs-on: ubuntu-latest
    strategy:
      matrix:
        container: [
          "ghcr.io/mach3-software/mach3:alma9latest",
          #"ghcr.io/mach3-software/mach3:rocky9cudalatest"
        ]
    container:
      image: ${{ matrix.container }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          languages: c-cpp
          build-mode: manual

      - name: Build Code
        run: |
          mkdir build
          cd build
          cmake ../ -DMaCh3_NUDOCK_ENABLED=ON -DNuFastLinear_ENABLED=ON -DNuFastEarth_ENABLED=ON -DCUDAProb3Linear_ENABLED=ON -DCUDAProb3_ENABLED=ON -DProb3ppLinear_ENABLED=ON -DOscProb_ENABLED=ON
          make

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81  # v4.37.3
